<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise RAG Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e8f0fe;
            border-color: #667eea;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .query-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .query-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        
        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .user-context {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .user-context input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .answer {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .sources {
            margin-top: 15px;
        }
        
        .source-item {
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        .stages {
            margin-top: 20px;
        }
        
        .stage {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .stage.decision-blocked {
            border-left-color: #dc3545;
        }
        
        .stage.decision-modified {
            border-left-color: #ffc107;
        }
        
        .stage.decision-allowed {
            border-left-color: #28a745;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 6px;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .documents-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .document-card {
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        
        .document-card h4 {
            margin-bottom: 8px;
            color: #333;
        }
        
        .document-card p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .error {
            padding: 15px;
            background: #fee;
            border-left: 4px solid #dc3545;
            border-radius: 6px;
            color: #721c24;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Enterprise RAG Demo</h1>
            <p>Upload documents, ask questions, and see policy enforcement in action</p>
        </div>
        
        <div class="content">
            <!-- Document Upload Section -->
            <div class="section">
                <h2>📄 Upload Documents</h2>
                <div class="upload-area" id="uploadArea">
                    <p>📎 Drag and drop files here or click to browse</p>
                    <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
                        Supported: PDF, DOCX, TXT, MD
                    </p>
                    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.md">
                </div>
                <div id="uploadStatus"></div>
            </div>
            
            <!-- Documents List -->
            <div class="section" id="documentsSection" style="display: none;">
                <h2>📚 Uploaded Documents</h2>
                <div class="documents-list" id="documentsList"></div>
            </div>
            
            <!-- Query Section -->
            <div class="section">
                <h2>💬 Ask a Question</h2>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="normal">Normal Mode</button>
                    <button class="mode-btn" data-mode="gatekeeper">Gatekeeper Mode</button>
                </div>
                
                <div class="user-context">
                    <input type="text" id="userRole" placeholder="User Role (e.g., admin, intern, guest)" value="user">
                    <input type="text" id="userDepartment" placeholder="Department (e.g., HR, IT)" value="general">
                </div>
                
                <div class="query-form">
                    <input type="text" class="query-input" id="queryInput" placeholder="Enter your question here...">
                    <button class="btn" onclick="submitQuery()">Ask</button>
                </div>
                
                <div id="queryResult"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8001';
        let currentMode = 'normal';
        let currentQueryId = null;
        
        // File upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(files) {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = '<div class="loading">Uploading...</div>';
            
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch(`${API_URL}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (response.ok) {
                        statusDiv.innerHTML = `<div style="color: green; padding: 10px;">✓ ${result.filename} uploaded successfully</div>`;
                        loadDocuments();
                    } else {
                        statusDiv.innerHTML = `<div class="error">Error: ${result.detail || 'Upload failed'}</div>`;
                    }
                } catch (error) {
                    statusDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                }
            }
        }
        
        async function loadDocuments() {
            try {
                const response = await fetch(`${API_URL}/api/documents`);
                const data = await response.json();
                
                const documentsSection = document.getElementById('documentsSection');
                const documentsList = document.getElementById('documentsList');
                
                if (data.documents && data.documents.length > 0) {
                    documentsSection.style.display = 'block';
                    documentsList.innerHTML = data.documents.map(doc => `
                        <div class="document-card">
                            <h4>${doc.filename}</h4>
                            <p>${doc.num_chunks} chunks</p>
                            <button class="btn btn-secondary" onclick="deleteDocument('${doc.doc_id}')" style="font-size: 0.8em; padding: 6px 12px;">Delete</button>
                        </div>
                    `).join('');
                } else {
                    documentsSection.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading documents:', error);
            }
        }
        
        async function deleteDocument(docId) {
            try {
                const response = await fetch(`${API_URL}/api/documents/${docId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadDocuments();
                }
            } catch (error) {
                console.error('Error deleting document:', error);
            }
        }
        
        // Mode selector
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });
        
        // Query submission
        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                alert('Please enter a question');
                return;
            }
            
            const resultDiv = document.getElementById('queryResult');
            resultDiv.innerHTML = '<div class="loading">Processing query...</div>';
            
            const userRole = document.getElementById('userRole').value || 'user';
            const userDepartment = document.getElementById('userDepartment').value || 'general';
            
            try {
                const response = await fetch(`${API_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        mode: currentMode,
                        user: {
                            role: userRole,
                            department: userDepartment
                        }
                    })
                });
                
                const result = await response.json();
                currentQueryId = result.query_id;
                
                if (response.ok) {
                    displayResult(result);
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${result.detail || 'Query failed'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function displayResult(result) {
            const resultDiv = document.getElementById('queryResult');
            
            let stagesHtml = '';
            if (result.stages) {
                stagesHtml = '<div class="stages"><h3>Policy Enforcement Stages</h3>';
                for (const [stageName, stageData] of Object.entries(result.stages)) {
                    const decision = stageData.decision || 'allowed';
                    stagesHtml += `
                        <div class="stage decision-${decision}">
                            <strong>${stageName.replace('_', ' ').toUpperCase()}:</strong> ${decision}
                            ${stageData.reason ? `<br><small>${stageData.reason}</small>` : ''}
                            ${stageData.trace ? `<br><small>Trace: ${JSON.stringify(stageData.trace)}</small>` : ''}
                        </div>
                    `;
                }
                stagesHtml += '</div>';
            }
            
            let sourcesHtml = '';
            if (result.sources && result.sources.length > 0) {
                sourcesHtml = '<div class="sources"><h4>Sources:</h4>';
                result.sources.forEach(source => {
                    sourcesHtml += `<div class="source-item">${source.filename} (similarity: ${(source.similarity * 100).toFixed(1)}%)</div>`;
                });
                sourcesHtml += '</div>';
            }
            
            let feedbackHtml = '';
            if (currentQueryId) {
                feedbackHtml = `
                    <div class="feedback">
                        <h4>Was this answer helpful?</h4>
                        <div class="feedback-buttons">
                            <button class="btn" onclick="submitFeedback(true)">👍 Yes</button>
                            <button class="btn btn-secondary" onclick="submitFeedback(false)">👎 No</button>
                        </div>
                    </div>
                `;
            }
            
            resultDiv.innerHTML = `
                <div class="result">
                    <h3>Answer:</h3>
                    <div class="answer">${result.answer || 'No answer generated'}</div>
                    ${sourcesHtml}
                    ${stagesHtml}
                    ${feedbackHtml}
                </div>
            `;
        }
        
        async function submitFeedback(helpful) {
            if (!currentQueryId) return;
            
            try {
                await fetch(`${API_URL}/api/feedback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query_id: currentQueryId,
                        helpful: helpful
                    })
                });
                
                alert('Thank you for your feedback!');
            } catch (error) {
                console.error('Error submitting feedback:', error);
            }
        }
        
        // Enter key to submit query
        document.getElementById('queryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitQuery();
            }
        });
        
        // Load documents on page load
        loadDocuments();
    </script>
</body>
</html>
